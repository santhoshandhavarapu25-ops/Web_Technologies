<!DOCTYPE html>
<html>

<head>
    <title>SBI Loan EMI Calculator</title>
    <style>
        input[type=number] {
            width: 100%;
            padding: 12px 20px;
            margin: 8px 0;
            box-sizing: border-box;
            border: 2px solid #ccc;
            border-radius: 4px;
            background-color: #f8f8f8;
            font-size: 16px;
        }

        input[type=submit] {
            background-color: #4CAF50;
            color: white;
            padding: 14px 20px;
            margin: 8px 0;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        h2 {
            text-align: center;
            font-size: 28px;
            margin-bottom: 20px;
        }
    </style>
    <script>
        function calculateEMI() {
            var loanAmount = document.getElementById("loan-amount").value;
            var interestRate = document.getElementById("interest-rate").value;
            var loanTenure = document.getElementById("loan-tenure").value;
            var monthlyInterestRate = interestRate / (12 * 100);
            var numberOfPayments = loanTenure * 12;
            var emi = (loanAmount * monthlyInterestRate * Math.pow(1 + monthlyInterestRate, numberOfPayments)) / (Math.pow(1 + monthlyInterestRate, numberOfPayments) - 1);
            var emiText = "Your monthly EMI is Rs. " + emi.toFixed(2);

            document.getElementById("emi-result").innerHTML = emiText;

        }

    </script>
</head>

<body>
    <h2>SBI Loan EMI Calculator</h2>
    <div>
        <label for="loan-amount">Loan Amount</label>
        <input type="number" id="loan-amount" name="loan-amount" placeholder="Enter loan amount in Rs.">
        <label for="interest-rate">Interest Rate</label>
        <input type="number" id="interest-rate" name="interest-rate" placeholder="Enter interest rate in %">
        <label for="loan-tenure">Loan Tenure</label>
        <input type="number" id="loan-tenure" name="loan-tenure" placeholder="Enter loan tenure in years">
        <input type="submit" value="Calculate EMI" onclick="calculateEMI ()">
        <p id="emi-result"></p>
    </div>
</body>

</html>
